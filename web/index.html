<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Earth Buddy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/i18n.js"></script>
  <script defer src="/charts.js"></script>
  <script defer src="/vendor/maplibre-gl/maplibre-gl.js"></script>
  <script defer src="/map.js"></script>
  <script defer src="/voice.js"></script>
  <script defer src="/investigation.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside id="side" class="side"></aside>
    <div class="scrim" data-act="nav"></div>
    <div class="page">
      <header id="top" class="top"></header>
      <main id="thread" class="thread"></main>
      <form id="composer" class="composer"></form>
    </div>
  </div>
  <dialog id="picker" class="picker"></dialog>
  <datalist id="eb-regions"></datalist>
  <div id="map-park" class="map-park">
    <section id="map-wrap" class="map-wrap">
      <div id="map" class="map" role="region"></div>
      <div id="map-key" class="map-key"></div>
    </section>
  </div>
  <noscript>Earth Buddy needs JavaScript to show results.</noscript>
</body>
</html>
